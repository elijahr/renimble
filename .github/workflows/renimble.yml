name: Renimble Dependency Updates

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run renimble
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: '.github/renimble.yml'
